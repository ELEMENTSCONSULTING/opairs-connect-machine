# CI: Image bauen, Pipelines pruefen, kompletten Stack mit Selbsttest starten
# und die SQL-Regressionstests ausfuehren.
# Fehlerausgaben erscheinen zusaetzlich als Annotation (scripts/ci-run.sh).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDKIT_PROGRESS: plain

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Testkonfiguration
        run: cp .env.example .env

      - name: Image bauen
        run: scripts/ci-run.sh "Image-Build" docker compose build connector iodd-mirror

      - name: Image pruefen (keine UMH-Dienste, Plugin-Auswahl)
        run: CI_NOTICE=1 scripts/ci-run.sh "Image-Pruefung" ./scripts/check-image.sh

      - name: IODD-Mirror Go-Tests (inkl. Kompatibilitaet mit sensorconnect-Plugin)
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/src" -w /src -e CGO_ENABLED=1 \
            golang:1.27.1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244 \
            go test -count=1 -race -v -tags plugincompat ./iodd_mirror/... | tee /tmp/gotest.log
          # Nachweis: die Kompatibilitaetstests muessen gelaufen sein
          n=$(grep -c '^--- PASS: TestPlugin' /tmp/gotest.log || true)
          summary=$(grep -E '^(--- (PASS|FAIL|SKIP)|ok|FAIL)' /tmp/gotest.log | tail -n 30 | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::notice title=IODD-Mirror Go-Tests (${n} Plugin-Tests)::${summary}"
          [ "$n" -ge 5 ] || { echo "::error title=IODD-Mirror::nur $n Plugin-Kompatibilitaetstests gelaufen"; exit 1; }

      - name: Superset-Dashboard (ZIP passt zum Generator)
        run: scripts/ci-run.sh "Superset-Dashboard" python3 superset/build_dashboard.py --check

      - name: Pipelines pruefen (benthos lint)
        run: |
          for f in pipelines/*.yaml pipelines/vorlagen/*.yaml; do
            case "$f" in *_benthos_test.yaml) continue;; esac
            scripts/ci-run.sh "Lint $(basename "$f")" docker run --rm \
              -e POSTGRES_DSN=postgres://u:p@opairs-connect-db:5432/opairs \
              -e MACHINE_NAME=ci -e OPCUA_ENDPOINT=opc.tcp://localhost:4840 \
              -v "$PWD/pipelines:/p:ro" \
              opairs-connect-machine:dev lint "/p/${f#pipelines/}"
          done

      - name: Pipeline-Unit-Tests (Mappings)
        run: |
          CI_NOTICE=1 scripts/ci-run.sh "Pipeline-Unit-Tests" docker run --rm \
            -e POSTGRES_DSN=postgres://u:p@opairs-connect-db:5432/opairs \
            -v "$PWD/pipelines:/p:ro" \
            opairs-connect-machine:dev test /p/...

      - name: Smoke-Test und SQL-Tests
        run: scripts/ci-run.sh "Smoke-Test" ./scripts/smoke-test.sh

      - name: Demo-Daten (Backfill und Entfernen)
        run: |
          CI_NOTICE=1 scripts/ci-run.sh "Demo-Backfill" ./scripts/demo.sh backfill
          n=$(docker compose exec -T opairs-connect-db psql -U opairs -d opairs -tAc "SELECT count(*) FROM opairs.machine_data_1min WHERE machine LIKE 'demo-%'")
          echo "Minutenwerte Demo: $n"
          [ "$n" -gt 20000 ] || { echo "::error title=Demo::zu wenige Minutenwerte ($n)"; exit 1; }
          bad=$(docker compose exec -T opairs-connect-db psql -U opairs -d opairs -tAc "SELECT COALESCE(sum(bad_count), 0) FROM opairs.machine_data_1min WHERE machine LIKE 'demo-cnc%'")
          echo "Werte Uncertain (CNC-Vibration): $bad"
          [ "$bad" -gt 100 ] || { echo "::error title=Demo::keine Uncertain-Spitzen in den CNC-Daten ($bad)"; exit 1; }
          codes=$(docker compose exec -T opairs-connect-db psql -U opairs -d opairs -tAc "SELECT count(DISTINCT state_code) FROM opairs.state_1min WHERE machine LIKE 'demo-%'")
          echo "Zustandscodes Demo: $codes"
          [ "$codes" -eq 9 ] || { echo "::error title=Demo::erwartet Zustandscodes 0-8, erhalten $codes"; exit 1; }
          oee=$(docker compose exec -T opairs-connect-db psql -U opairs -d opairs -tAc "SELECT round((1000 * sum(nettoproduktiv_min) / nullif(sum(planbelegung_min), 0))::numeric) FROM opairs.v_oee_1min WHERE machine LIKE 'demo-%'")
          echo "OEE Demo (Promille): $oee"
          [ "${oee:-0}" -gt 500 ] && [ "$oee" -lt 950 ] || { echo "::error title=Demo::OEE unplausibel ($oee Promille)"; exit 1; }
          scripts/ci-run.sh "Demo-Entfernen" ./scripts/demo.sh remove
          left=$(docker compose exec -T opairs-connect-db psql -U opairs -d opairs -tAc "SELECT (SELECT count(*) FROM opairs.asset WHERE machine LIKE 'demo-%') + (SELECT count(*) FROM opairs.state_1min WHERE machine LIKE 'demo-%')")
          [ "$left" -eq 0 ] || { echo "::error title=Demo::nach dem Entfernen noch $left Demo-Zeilen"; exit 1; }

      - name: Logs bei Fehler
        if: failure()
        run: scripts/ci-run.sh "Container-Logs" sh -c 'docker compose logs --no-color --tail=40; exit 1' || true

      - name: Aufraeumen
        if: always()
        run: docker compose down -v
