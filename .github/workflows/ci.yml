# CI: Image bauen, Pipelines pruefen, kompletten Stack mit Selbsttest starten
# und die SQL-Regressionstests ausfuehren.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Testkonfiguration
        run: cp .env.example .env

      - name: Image bauen
        run: docker compose build connector

      - name: Pipelines pruefen (benthos lint)
        run: |
          for f in pipelines/*.yaml; do
            echo "lint $f"
            docker run --rm \
              -e POSTGRES_DSN=postgres://u:p@db:5432/opairs \
              -e MACHINE_NAME=ci -e OPCUA_ENDPOINT=opc.tcp://localhost:4840 \
              -v "$PWD/pipelines:/p:ro" \
              opairs-connect-machine:dev lint "/p/$(basename "$f")"
          done

      - name: Smoke-Test und SQL-Tests
        run: ./scripts/smoke-test.sh

      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color

      - name: Aufraeumen
        if: always()
        run: docker compose down -v
