# OPAIRS Connect: Connector + Postgres + Wartungsjob
#
#   cp .env.example .env     (Passwoerter anpassen, URL-sichere Zeichen verwenden)
#   docker compose up -d --build
#
# Standardmaessig laeuft die Selbsttest-Pipeline. Fuer echte Maschinen in .env
# PIPELINE auf eine Datei aus ./pipelines setzen.

# Log-Rotation fuer alle Dienste (sonst laufen On-Prem-Platten voll)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opairs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (.env)}
      POSTGRES_DB: ${POSTGRES_DB:-opairs}
      OPAIRS_WRITER_PASSWORD: ${OPAIRS_WRITER_PASSWORD:?OPAIRS_WRITER_PASSWORD fehlt (.env)}
      OPAIRS_READER_PASSWORD: ${OPAIRS_READER_PASSWORD:?OPAIRS_READER_PASSWORD fehlt (.env)}
    volumes:
      - opairs-pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 erzwingt TCP: waehrend der Erstinitialisierung lauscht
      # Postgres nur auf dem Socket, so gilt die DB erst danach als bereit.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    # Fuer Superset von ausserhalb des Hosts: Port freigeben (nur bei Bedarf,
    # und dann moeglichst nur im internen Netz / mit TLS):
    # ports:
    #   - "127.0.0.1:5432:5432"

  connector:
    image: opairs-connect-machine:${APP_VERSION:-dev}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      iodd-mirror:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://opairs_writer:${OPAIRS_WRITER_PASSWORD}@db:5432/${POSTGRES_DB:-opairs}?sslmode=disable
      MACHINE_NAME: ${MACHINE_NAME:-machine-01}
      OPCUA_ENDPOINT: ${OPCUA_ENDPOINT:-opc.tcp://host.docker.internal:4840}
      IFM_MASTER_ADDRESS: ${IFM_MASTER_ADDRESS:-192.168.0.1}
      IODD_API: ${IODD_API:-http://iodd-mirror:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./pipelines:/etc/opairs/pipelines:ro
    command: ["-c", "${PIPELINE:-/etc/opairs/pipelines/selftest.yaml}"]
    # Benthos-Status: http://<host>:4195/ready (Port bei Bedarf freigeben)

  # Lokaler IODDfinder-Ersatz fuer ifm IO-Link-Master (siehe iodd/README.md).
  # Laeuft ohne Internet; IODD-Dateien liegen in ./iodd.
  iodd-mirror:
    image: opairs-iodd-mirror:${APP_VERSION:-dev}
    build:
      context: .
      dockerfile: iodd_mirror/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./iodd:/data:ro
    healthcheck:
      test: ["CMD", "/iodd-mirror", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Uebersicht der IODDs unter http://<host>:8080/ (Port bei Bedarf freigeben)
    # ports:
    #   - "127.0.0.1:8080:8080"

  # Beim Start: Schema anwenden (Updates). Danach alle 5 Minuten: Partitionen im
  # Voraus anlegen, alte Rohdaten loeschen, Minutenwerte berechnen.
  maintenance:
    image: postgres:17
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-opairs}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-opairs}
      PGOPTIONS: "-c client_min_messages=warning"
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
      AGG_RETENTION_DAYS: ${AGG_RETENTION_DAYS:-400}
    volumes:
      - ./sql:/opt/opairs/sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until psql -q -v ON_ERROR_STOP=1 -f /opt/opairs/sql/001_schema.sql >/dev/null; do
          echo "opairs: Schema konnte nicht angewendet werden, neuer Versuch in 10 s"
          sleep 10
        done
        echo "opairs: Schema aktuell, Wartung startet"
        # Jeder Schritt in eigener Transaktion: ein Fehler in einem Schritt
        # haelt die anderen nicht auf, und die kurze Tabellensperre beim
        # Anlegen einer Partition endet sofort danach.
        step() { psql -q -v ON_ERROR_STOP=1 -c "$$1" >/dev/null || echo "opairs: fehlgeschlagen: $$1"; }
        while true; do
          step "SELECT opairs.maintain_partitions(ahead_days => 7, raw_retention => make_interval(days => $${RAW_RETENTION_DAYS}))"
          step "SELECT opairs.aggregate_1min()"
          step "SELECT opairs.purge_aggregates(make_interval(days => $${AGG_RETENTION_DAYS}))"
          sleep 300
        done

volumes:
  opairs-pgdata:
