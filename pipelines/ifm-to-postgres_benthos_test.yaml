# Unit-Tests fuer das Mapping (ohne Geraet, ohne Datenbank):
#   docker run --rm -v "$PWD/pipelines:/p:ro" opairs-connect-machine:dev test /p/...
tests:
  - name: IODD-dekodierte Werte werden eine Zeile je Messgroesse
    environment:
      MACHINE_NAME: m1
    target_processors: /pipeline/processors
    input_batch:
      - content: '{"Temperature": 39.4, "OUT1": true, "Device status": "OK", "Info": {"a": 1}}'
        metadata:
          sensorconnect_port_number: "2"
    output_batches:
      - - bloblang: 'this.tag == "port2.Device status" && this.value == null && this.value_text == "OK" && this.machine == "m1"'
        - bloblang: 'this.tag == "port2.Info" && this.value == null && this.value_text == "{\"a\":1}"'
        - bloblang: 'this.tag == "port2.OUT1" && this.value == 1 && this.value_text == null'
        - bloblang: 'this.tag == "port2.Temperature" && this.value == 39.4 && this.value_text == null && this.quality == "Good" && this.ts.type() == "string"'

  - name: Rohdaten ohne IODD
    environment:
      MACHINE_NAME: m1
    target_processors: /pipeline/processors
    input_batch:
      - content: '"0A1B"'
        metadata:
          sensorconnect_port_number: "4"
    output_batches:
      - - bloblang: 'this.tag == "port4.raw" && this.value == null && this.value_text == "0A1B"'
